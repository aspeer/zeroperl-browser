name: Build, qualify and stage browser package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Submit the qualified package to npm staging (requires maintainer MFA approval afterward)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: browser-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - name: Pack the publication candidate
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts --json > artifacts/pack.json
          node scripts/release-manifest.mjs artifacts
      - name: Test the actual archive in a fresh consumer
        run: |
          package_file="$(node -p "require('./artifacts/pack.json')[0].filename")"
          node t.js/packed.mjs "artifacts/$package_file"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-npm-candidate
          path: artifacts/
          if-no-files-found: error

  stage:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Download candidate from this successful qualification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name browser-npm-candidate --dir artifacts
      - name: Verify source and candidate integrity
        run: node scripts/release-manifest.mjs artifacts --verify
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tgz
      - name: Stage with npm Trusted Publishing
        run: |
          package_file="$(node -p "require('./artifacts/pack.json')[0].filename")"
          npm stage publish "./artifacts/$package_file" --access public --provenance --ignore-scripts --dry-run
          npm stage publish "./artifacts/$package_file" --access public --provenance --ignore-scripts
          echo 'Package staged; awaiting maintainer review and MFA approval on npm. It is not public yet.' >> "$GITHUB_STEP_SUMMARY"
